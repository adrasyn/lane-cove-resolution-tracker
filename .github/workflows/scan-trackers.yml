name: Check Council trackers (manual trial)
on:
  workflow_dispatch:
# No schedule or deployment is enabled. See docs/DATA-UPDATES.md before activation.
permissions:
  contents: read
concurrency:
  group: council-tracker-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitor.txt
      - run: python scripts/scan_trackers.py
      - name: Add scan summary
        if: always()
        run: |
          if [ -f scan-output/summary.md ]; then
            cat scan-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep report and changed PDFs for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: council-tracker-scan
          path: scan-output/
          if-no-files-found: error
          retention-days: 30
