name: Catalogue and scanner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitor.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python catalogue/build_catalogue.py
      - run: node scripts/verify-catalogue.cjs
      - run: node scripts/verify-route-motion.cjs
      - run: node scripts/verify-source-links.cjs
      - run: node scripts/verify-browsing.cjs
      - run: node --check dist/app.js
      - run: git diff --exit-code -- dist
